<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="493" cy="-75" r="84" fill="#991b1b" opacity="0.07"/>
    <circle cx="319" cy="440" r="53" fill="#991b1b" opacity="0.10"/>
    <circle cx="505" cy="628" r="81" fill="#991b1b" opacity="0.09"/>
    <circle cx="192" cy="115" r="27" fill="#991b1b" opacity="0.15"/>
    <circle cx="449" cy="-13" r="42" fill="#991b1b" opacity="0.13"/>
    <circle cx="834" cy="581" r="32" fill="#991b1b" opacity="0.16"/>
    <rect x="333" y="258" width="74" height="56" rx="8" fill="#b91c1c" opacity="0.13" transform="rotate(1, 191, 160)"/>
    <rect x="1153" y="281" width="30" height="98" rx="8" fill="#b91c1c" opacity="0.03" transform="rotate(2, 1208, 288)"/>
    <rect x="403" y="118" width="67" height="68" rx="8" fill="#b91c1c" opacity="0.03" transform="rotate(1, 1003, 301)"/>
    <rect x="1190" y="275" width="78" height="43" rx="8" fill="#b91c1c" opacity="0.04" transform="rotate(24, 814, -17)"/>
    <rect x="959" y="663" width="98" height="99" rx="8" fill="#b91c1c" opacity="0.03" transform="rotate(1, -20, 331)"/>
    <rect x="956" y="-68" width="36" height="22" rx="8" fill="#b91c1c" opacity="0.03" transform="rotate(4, 774, 306)"/>
    <rect x="905" y="680" width="42" height="53" rx="8" fill="#b91c1c" opacity="0.13" transform="rotate(28, 647, 510)"/>
    <rect x="-2" y="208" width="38" height="94" rx="8" fill="#b91c1c" opacity="0.07" transform="rotate(37, 1190, 171)"/>
    <polygon points="952,202 1032,362 872,362" fill="#991b1b" opacity="0.12"/>
    <polygon points="115,313 193,469 37,469" fill="#991b1b" opacity="0.07"/>
    <polygon points="1147,651 1217,791 1077,791" fill="#991b1b" opacity="0.12"/>
    <polygon points="46,241 80,309 12,309" fill="#991b1b" opacity="0.07"/>

  <!-- Wave at bottom -->
  <path d="M0,562 C360,596 840,528 1200,562 L1200,630 L0,630Z" fill="#991b1b" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    화곡 셔츠룸
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 힙플레이스 카페
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#fca5a5" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 화곡 셔츠룸 — 힙플레이스 카페
  </text>
</svg>